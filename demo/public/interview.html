<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康桥 AI 升学诊断 · AI 诊断访谈</title>
<link rel="stylesheet" href="css/kangqiao.css">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 40px;}
.top h1{font-size:24px;color:var(--kq-d);margin:0 0 4px;}
.top p{font-size:13px;color:var(--text-l);margin:0;}
.nav-links{display:flex;justify-content:space-between;align-items:center;margin:16px 0;gap:10px;}
.nav-links a{font-size:14px;color:var(--kq);text-decoration:none;font-weight:500;}
.nav-links a:hover{text-decoration:underline;}
.nav-right{display:flex;gap:14px;align-items:center;}
.btn-skip{font-size:13px;color:var(--text-l);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer;font-family:inherit;text-decoration:none;transition:.12s;}
.btn-skip:hover{background:var(--soft);border-color:var(--kq);color:var(--kq-d);}

.chat-layout{display:flex;gap:18px;margin-top:8px;align-items:flex-start;}
.chat-col{flex:1 1 auto;min-width:0;}
.asset-col{flex:0 0 300px;position:sticky;top:14px;}

/* 聊天区 */
.chat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;min-height:340px;display:flex;flex-direction:column;gap:14px;}
.msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.msg.ai{align-self:flex-start;background:var(--soft);color:var(--text);border-bottom-left-radius:4px;}
.msg.me{align-self:flex-end;background:var(--kq);color:#fff;border-bottom-right-radius:4px;}
.msg.ai .who{display:block;font-size:11px;color:var(--kq);font-weight:700;margin-bottom:3px;}

/* 输入区 */
.composer{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
.opts{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px;}
.opt{padding:8px 14px;border:1px solid var(--kq);border-radius:999px;background:#fff;color:var(--kq-d);font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;user-select:none;}
.opt:hover{background:var(--soft);}
.opt.on{background:var(--kq);color:#fff;border-color:var(--kq);}
.opt.multi::before{content:"☐ ";opacity:.7;}
.opt.multi.on::before{content:"☑ ";}
.input-row{display:flex;gap:9px;}
.input-row input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
.input-row input:focus{outline:none;border-color:var(--kq);box-shadow:0 0 0 3px var(--soft);}
.btn{padding:10px 18px;font-size:14px;background:var(--kq);color:#fff;border:none;border-radius:9px;cursor:pointer;font-weight:600;font-family:inherit;white-space:nowrap;transition:.15s;}
.btn:hover{background:var(--kq-d);}
.btn.ghost{background:#fff;color:var(--kq-d);border:1px solid var(--kq);}
.btn.ghost:hover{background:var(--soft);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{font-size:12px;color:var(--text-l);margin:0 0 10px;}

/* 资产面板 */
.asset-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.asset-card h3{margin:0 0 4px;font-size:15px;color:var(--kq-d);}
.asset-card .cnt{font-size:12px;color:var(--text-l);margin-bottom:10px;}
.asset-list{display:flex;flex-direction:column;gap:9px;max-height:460px;overflow:auto;}
.asset{border-left:4px solid var(--kq);background:var(--soft);border-radius:0 8px 8px 0;padding:9px 11px;}
.asset .cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--kq);border-radius:4px;padding:1px 7px;margin-bottom:4px;}
.asset .ttl{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:2px;}
.asset .dt{font-size:12px;color:var(--text-l);line-height:1.55;}
.asset.empty{color:var(--text-l);background:transparent;border-left-color:var(--line);font-size:13px;padding:6px 0;}

footer{margin-top:26px;font-size:11px;color:var(--text-l);text-align:center;}

@media (max-width:820px){
  .chat-layout{flex-direction:column;}
  .asset-col{flex:1 1 auto;position:static;width:100%;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>AI 诊断访谈</h1>
    <p>Step 2 / 5 · 与康桥 AI 助手对话，挖掘竞争力与隐藏「战略期权」（对话式，可点选项也可自由输入）</p>
  </header>

  <div class="nav-links">
    <a href="input.html" class="back">◀ 信息录入</a>
    <div class="nav-right">
      <a href="report.html" class="btn-skip" title="跳过访谈，直接进入下一步">⏭ 跳过</a>
      <a href="report.html" class="forward">生成报告和老师审批 ▶</a>
    </div>
  </div>

  <div class="topnav" id="topnav"></div>

  <div class="chat-layout">
    <div class="chat-col">
      <div class="chat" id="chat"></div>
      <div class="composer" id="composer">
        <p class="hint" id="hint">点击下方选项，或直接输入你的回答。</p>
        <div class="opts" id="opts"></div>
        <div class="input-row">
          <input id="freeInput" type="text" placeholder="也可手动输入…" autocomplete="off">
          <button class="btn" id="btnSend">发送</button>
          <button class="btn ghost" id="btnContinue" style="display:none;">继续 ▶</button>
        </div>
      </div>
    </div>

    <div class="asset-col">
      <div class="asset-card">
        <h3>🔍 已挖掘战略资产</h3>
        <div class="cnt" id="assetCnt">0 项</div>
        <div class="asset-list" id="assetList">
          <div class="asset empty">对话中挖到的隐藏资产会实时出现在这里。</div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn ghost" id="btnRestart" style="font-size:13px;padding:7px 13px;">↻ 重新访谈</button>
        </div>
      </div>
    </div>
  </div>

  <footer>康桥 AI 升学竞争力诊断与培养规划 · 内部 Demo（预置 Henry 假数据，未接 API）</footer>
</div>

<script src="js/henry-data.js"></script>
<script>
// —— 顶部 5 步导航 ——
const steps = ['录入', 'AI访谈', '生成报告和老师审批', '校长审批', '导出'];
const active = 1; // 本页 = AI 诊断访谈
document.getElementById('topnav').innerHTML = steps.map((s, i) =>
  `<span class="step ${i === active ? 'active' : ''}">${i + 1}. ${s}</span>`).join('');

const H = window.HENRY;
const $ = id => document.getElementById(id);

// —— 资产收集 ——
const CAT_COLOR = { '身份类':'#920783', '能力类':'#6c8e2e', '经历类':'#2e7ea6', '家庭类':'#b06a00', '风险类':'#b0303a' };
let assets = [];
function addAsset(cat, title, detail) {
  if (assets.find(a => a.title === title)) return;
  assets.push({ cat, title, detail });
  renderAssets();
  saveState();
}
function renderAssets() {
  $('assetCnt').textContent = assets.length + ' 项';
  const box = $('assetList');
  if (!assets.length) {
    box.innerHTML = '<div class="asset empty">对话中挖到的隐藏资产会实时出现在这里。</div>';
    return;
  }
  box.innerHTML = assets.map(a => {
    const c = CAT_COLOR[a.cat] || 'var(--kq)';
    return `<div class="asset" style="border-left-color:${c}">
      <span class="cat" style="background:${c}">${a.cat}</span>
      <div class="ttl">${a.title}</div>
      <div class="dt">${a.detail}</div>
    </div>`;
  }).join('');
}
function saveState() {
  localStorage.setItem('interviewResult', JSON.stringify({ assets, savedAt: new Date().toISOString() }));
}

// —— 会话图（节点式，根据回答动态追问）——
const NODES = {
  start: {
    ai: "你好，我是康桥 AI 升学诊断助手 👋\n我会通过几个问题了解 Henry 的情况，重点挖掘他的竞争力与隐藏的「战略期权」。我们从升学目标聊起——",
    q: "Henry 的升学目标国家 / 地区是哪里？",
    options: ["港三（港大 / 港科大 / 港中文）", "美国", "英国 / 其他", "暂时不确定"],
    next: (a) => {
      const t = a.toLowerCase();
      if (t.includes('美')) addAsset('能力类', '赴美签证保护', '美国方向：德 / 欧盟公民申请美国顶尖理工院校可豁免 PP 10043 对中国籍研究生的签证限制。');
      if (t.includes('不确定') || t.includes('没想') || t.includes('不知道')) addAsset('风险类', '目标待探索', '目标暂不确定 → 系统转入探索式诊断，优先补齐画像、再匹配方向。');
      return 'nationality';
    }
  },
  nationality: {
    ai: "明白。身份背景对「战略期权」非常关键，这也是康桥诊断区别于通用工具的核心。",
    q: "Henry 的国籍 / 公民身份是？",
    options: ["德国籍（欧盟公民）", "中国籍", "其他国籍"],
    prefillFrom: 'nationality',
    next: (a) => {
      const t = a.toLowerCase();
      if (t.includes('德') || t.includes('eu') || t.includes('欧盟')) {
        addAsset('身份类', '德国籍 = 欧盟公民身份', '将来可低学费甚至免学费就读德国、瑞士等欧洲顶尖大学（TUM / ETH / TU Delft），为港三全奖之外多留一条稳妥后路。');
        return 'eu_deep';
      }
      return 'activities';
    }
  },
  eu_deep: {
    ai: "太好了——德国籍是 Henry 的关键差异化资产 🇩🇪\n它不仅能打开欧洲近乎免学费的保底通道，还在多处降低风险。我想再确认一点：",
    q: "除了德国，家庭是否还有其他欧盟 / 欧洲联系？（可多选，也可跳过）",
    multi: true,
    options: ["德语流利", "曾在欧洲居住 / 生活", "无其它欧洲联系", "跳过本问"],
    next: (sel) => {
      if (sel.includes('德语')) addAsset('能力类', '德语能力', '德语流利 → 可直接申请德语区顶尖大学（如 TUM 德语授课项目），选择面更广。');
      if (sel.includes('欧洲居住')) addAsset('经历类', '欧洲生活经历', '曾在欧洲居住 → 对欧陆文化 / 体系更熟悉，文书与面试有真实素材。');
      return 'activities';
    }
  },
  activities: {
    ai: "接下来聊聊课堂之外的亮点——竞赛、志愿、社团、家庭资源等都能成为差异化素材。",
    q: "Henry 有哪些突出的课外活动 / 成就？（可多选）",
    multi: true,
    options: ["竞赛获奖", "志愿服务 / 公益", "家庭企业 / 资源", "双文化 / 海外经历", "领导力 / 社团"],
    next: (sel) => {
      if (sel.includes('竞赛')) addAsset('经历类', '竞赛硬实力', 'MK金×3 / AMC8 Top5% / BC生物全球银 / Spelling Bee 上海一等 / 演讲国赛金——数理 + 表达双线突出。');
      if (sel.includes('志愿')) addAsset('经历类', '志愿服务', 'Service as Action / 志愿公益经历 → 补强 CAS 与领导力叙事（注：当前 Service 0/7 为全奖硬伤，需尽快补足）。');
      if (sel.includes('家庭')) addAsset('家庭类', '家庭资源', '家庭企业 / 资源可作为背景支撑与潜在项目素材。');
      if (sel.includes('双文化')) addAsset('经历类', '双文化背景', '中德双文化背景 → 国际化叙事优势，契合港校双语书院制。');
      if (sel.includes('领导力')) addAsset('能力类', '领导力', '社团 / 领导力经历 → 强化全人画像。');
      return sel.includes('竞赛') ? 'competition_deep' : 'wrapup';
    }
  },
  competition_deep: {
    ai: "竞赛是 Henry 很强的亮点，我想挖得更具体一点，方便后面匹配专业方向。",
    q: "他最突出的竞赛 / 奖项有哪些？（可多选，也可直接输入）",
    multi: true,
    options: ["MK 数学金×3", "AMC8 Top5%", "BC 生物全球银", "Spelling Bee 上海一等", "演讲国赛金"],
    next: (sel) => {
      if (sel.length) addAsset('经历类', '竞赛明细', '突出竞赛：' + sel.join('、'));
      return 'wrapup';
    }
  },
  wrapup: {
    summary: true,
    ai: "已经收集得差不多啦！基于对话，我帮 Henry 挖到了以下「隐藏战略资产」👇\n左侧面板是实时清单，右上「生成报告和老师审批 ▶」可进入下一步。\n如需调整，点「↻ 重新访谈」即可重来。"
  }
};

// —— 引擎 ——
let current = 'start';
let multiSel = [];

function pushBubble(role, text) {
  const chat = $('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (role === 'ai') d.innerHTML = '<span class="who">🤖 康桥 AI 助手</span>' + escapeHtml(text);
  else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderNode(id) {
  current = id;
  const node = NODES[id];
  multiSel = [];
  const optsBox = $('opts');
  const hint = $('hint');
  const sendBtn = $('btnSend');
  const contBtn = $('btnContinue');
  const input = $('freeInput');

  if (node.summary) {
    pushBubble('ai', node.ai);
    optsBox.innerHTML = '';
    hint.textContent = '访谈完成，可进入下一步或重新访谈。';
    sendBtn.style.display = 'none';
    contBtn.style.display = 'none';
    input.style.display = 'none';
    return;
  }

  pushBubble('ai', node.ai + '\n\n' + node.q);

  // 选项
  optsBox.innerHTML = '';
  (node.options || []).forEach(label => {
    const b = document.createElement('button');
    b.className = 'opt' + (node.multi ? ' multi' : '');
    b.textContent = label;
    b.onclick = () => onOptionClick(node, label, b);
    optsBox.appendChild(b);
  });

  // 输入区状态
  input.style.display = '';
  input.value = '';
  if (node.prefillNote) hint.textContent = node.prefillNote + ' ' + hint.textContent;
  if (node.multi) {
    hint.textContent = '可点选多个选项（再次点击取消），也可手动输入；选完后点「继续 ▶」。';
    sendBtn.style.display = 'none';
    contBtn.style.display = '';
  } else {
    hint.textContent = '点击下方选项，或直接输入你的回答后点「发送」。';
    sendBtn.style.display = '';
    contBtn.style.display = 'none';
  }
  input.focus();
}

function onOptionClick(node, label, btn) {
  if (node.multi) {
    const i = multiSel.indexOf(label);
    if (i >= 0) { multiSel.splice(i, 1); btn.classList.remove('on'); }
    else { multiSel.push(label); btn.classList.add('on'); }
  } else {
    pushBubble('me', label);
    const nextId = node.next(label);
    if (nextId) renderNode(nextId);
  }
}

function onSend() {
  const node = NODES[current];
  if (node.multi) return; // 多选节点用「继续」
  const v = $('freeInput').value.trim();
  if (!v) return;
  pushBubble('me', v);
  $('freeInput').value = '';
  const nextId = node.next(v);
  if (nextId) renderNode(nextId);
}

function onContinue() {
  const node = NODES[current];
  if (!node.multi) return;
  const typed = $('freeInput').value.trim();
  const sel = multiSel.slice();
  if (typed && !sel.includes(typed)) sel.push(typed);
  $('freeInput').value = '';
  const nextId = node.next(sel);
  if (nextId) renderNode(nextId);
}

$('btnSend').onclick = onSend;
$('btnContinue').onclick = onContinue;
$('freeInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); NODES[current].multi ? onContinue() : onSend(); } });
$('btnRestart').onclick = () => {
  assets = [];
  renderAssets();
  saveState();
  $('chat').innerHTML = '';
  renderNode('start');
};

// —— 初始化：回填 Step1 国籍、载入历史资产 ——
function init() {
  try {
    const raw = localStorage.getItem('interviewResult');
    if (raw) {
      const d = JSON.parse(raw);
      if (Array.isArray(d.assets)) { assets = d.assets; renderAssets(); }
    }
  } catch (e) {}

  // 若 Step1 已录入国籍，预填到 nationality 节点选项提示（不自动作答，仅作上下文）
  let step1 = null;
  try { step1 = JSON.parse(localStorage.getItem('studentInput') || 'null'); } catch (e) {}
  if (step1 && step1.nationality) {
    const nat = NODES.nationality;
    nat.prefillNote = '（已从「信息录入」读到国籍：' + step1.nationality + '）';
  }

  renderAssets();
  // 有历史资产则直接展示汇总，否则从头开始
  if (assets.length) renderNode('wrapup');
  else renderNode('start');
}
init();
</script>
<button class="reset-fab" title="清空所有录入/审批数据并回到首页" onclick="if(confirm('确定重置演示数据？\n将清空录入、AI访谈、老师/校长审批等所有记录，并回到首页。')){['studentInput','teacherReportHTML','teacherNote','principalNote','principalSign','interviewResult','principalStatus','trails'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});location.href='index.html';}">🔄 重置演示</button>
</body>
</html>
