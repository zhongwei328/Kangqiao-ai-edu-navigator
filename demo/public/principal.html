<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康桥 AI 升学诊断 · 校长审批</title>
<link rel="stylesheet" href="css/kangqiao.css">
<link rel="stylesheet" href="css/teacher.css">
<style>
/* 校长审批页专属样式 */
.principal-wrap{max-width:1040px;margin:0 auto;padding:28px 22px 60px;}
.principal-wrap > header.top{border-left:6px solid var(--kq);padding:6px 0 6px 16px;margin-bottom:8px;}
.principal-wrap > header.top h1{margin:0;font-size:22px;color:var(--kq-d);}
.principal-wrap > header.top p{margin:4px 0 0;color:var(--text-l);font-size:13px;}
.nav-links{display:flex;justify-content:space-between;margin:16px 0;}
.nav-links a{font-size:14px;color:var(--kq);text-decoration:none;font-weight:500;}
.nav-links a:hover{text-decoration:underline;}
.nav-links .back{float:left;}
.nav-links .forward{float:right;}
.principal-approve-bar{background:linear-gradient(135deg,#faf3fb,#f3e7f0);border:1px solid #e2c4dd;border-radius:14px;padding:18px 20px;margin:20px 0;}
.principal-approve-bar h3{margin:0 0 12px;font-size:15px;color:var(--kq-d);}
.principal-approve-bar textarea{width:100%;min-height:100px;border:1px solid #cdb0c6;border-radius:10px;padding:12px;font-family:inherit;font-size:13px;resize:vertical;margin-bottom:12px;box-sizing:border-box;}
.principal-actions{display:flex;gap:12px;justify-content:flex-end;}
.principal-actions .btn{padding:10px 20px;font-size:14px;}
.principal-actions .btn-agree{background:#23ac38;color:#fff;border:none;border-radius:9px;cursor:pointer;font-weight:600;}
.principal-actions .btn-reject{background:#e74c3c;color:#fff;border:none;border-radius:9px;cursor:pointer;font-weight:600;}
.signature-row{margin-top:16px;padding-top:12px;border-top:1px dashed #d8b8e6;}
.signature-row label{font-size:13px;color:var(--text-l);margin-right:8px;}
.signature-row input{border:none;border-bottom:1px solid #cdb0c6;padding:4px 0;font-size:14px;width:200px;outline:none;}
.signature-row input:focus{border-bottom-color:var(--kq);}
.trail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.trail-head h2{margin:0;}
.trail-clear{font-size:12px;color:#e74c3c;background:#fff;border:1px solid #f0b8b0;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:500;white-space:nowrap;}
.trail-clear:hover{background:#fdeceb;}
</style>
</head>
<body>
<div class="wrap principal-wrap">
  <header class="top">
    <h1 id="reportTitle">校长审批</h1>
    <p>Step 4 / 5 · 校长审阅老师提交的诊断报告，可批准通过或退回修改</p>
    <p id="reportSub">请审阅老师提交的诊断报告</p>
  </header>

  <!-- 导航链接 -->
  <div class="nav-links">
    <a href="report.html" class="back">◀ 返回「生成报告和老师审批」</a>
    <a href="export.html" class="forward">「导出」▶</a>
  </div>

  <!-- 顶部步骤导航 -->
  <div class="topnav" id="topnav"></div>

  <!-- 报告内容 -->
  <main id="report">
    <p style="color:var(--text-l);font-size:13px;">报告加载中…</p>
  </main>

  <!-- 老师审批意见展示 -->
  <div id="teacherNoteDisplay"></div>

  <!-- 修订留痕展示 -->
  <div id="trailDisplay"></div>

  <!-- 校长审批操作栏 -->
  <div class="principal-approve-bar">
    <h3>📝 校长审批意见</h3>
    <textarea id="principalNote" placeholder="请填写审批意见，例如：同意通过 / 建议修改 XXX..."></textarea>
    <div class="principal-actions">
      <button class="btn-reject" onclick="handleReject()">🔄 退回修改</button>
      <button class="btn-agree" onclick="handleAgree()">✅ 同意通过</button>
    </div>
    <div class="signature-row">
      <label>校长签名：</label>
      <input type="text" id="principalSign" placeholder="请输入姓名">
    </div>
  </div>

  <footer id="reportFooter"></footer>
</div>

<script src="js/henry-data.js"></script>
<script>
// 校长审批页逻辑
(function() {
  const H = window.applyInputOverride(window.HENRY);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 5步导航，高亮第4步
  const steps = ['录入', 'AI访谈', '生成报告和老师审批', '校长审批', '导出'];
  const active = 3; // 校长审批 = 第4步
  document.getElementById('topnav').innerHTML = steps.map((s, i) =>
    `<span class="step ${i === active ? 'active' : ''}">${i + 1}. ${s}</span>`).join('');

  // 显示标题
  document.getElementById('reportTitle').textContent = '校长审批';
  document.getElementById('reportSub').textContent = '请审阅老师提交的诊断报告';

  // 渲染报告内容（复用模块3的渲染逻辑）
  function starPct(stars) {
    const full = (stars.match(/★/g) || []).length;
    const half = (stars.match(/½/g) || []).length;
    return Math.round(((full + half * 0.5) / 5) * 100);
  }

  function buildRoadmap(rm) {
    const n = rm.stages.length;
    const sx = i => 70 + 140 * i;
    const goalX = sx(n - 1) + 130;
    const W = goalX + 60;
    const Hh = 210, y = 95;
    let nodes = '';
    rm.stages.forEach((st, i) => {
      const x = sx(i);
      const fill = st.current ? '#920783' : '#fff';
      const txtColor = st.current ? '#fff' : '#6c0561';
      nodes += `<circle cx="${x}" cy="${y}" r="28" fill="${fill}" stroke="#920783" stroke-width="3"/>`;
      nodes += `<text x="${x}" y="99" fill="${txtColor}" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">${esc(st.label)}</text>`;
      if (st.sub) nodes += `<text x="${x}" y="113" fill="${txtColor}" font-size="9" text-anchor="middle" font-family="sans-serif">${esc(st.sub)}</text>`;
      nodes += `<text x="${x}" y="148" fill="#333" font-size="11" text-anchor="middle" font-family="sans-serif">${esc(st.desc)}</text>`;
    });
    const g = rm.goal;
    nodes += `<circle cx="${goalX}" cy="${y}" r="36" fill="#55044c" stroke="#920783" stroke-width="3"/>`;
    nodes += `<text x="${goalX}" y="90" fill="#fff" font-size="20" text-anchor="middle" font-family="sans-serif">${g.emoji}</text>`;
    nodes += `<text x="${goalX}" y="108" fill="#fff" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">${esc(g.sub)}</text>`;
    nodes += `<text x="${goalX}" y="158" fill="#6c0561" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">${esc(g.main)}</text>`;
    nodes += `<text x="${goalX}" y="174" fill="#23ac38" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">${esc(g.note)}</text>`;
    return `<svg class="roadmap" viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="成长路线图">
      <defs><linearGradient id="kqline" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#920783"/><stop offset="100%" stop-color="#55044c"/></linearGradient></defs>
      <line x1="70" y1="${y}" x2="${goalX}" y2="${y}" stroke="url(#kqline)" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
      ${nodes}
    </svg>`;
  }

  function sec1() {
    const p = H.profile;
    const chips = p.chips.map(c => `<span class="chip"><b>${esc(c.k)}</b> ${esc(c.v)}${c.note?`<small>${esc(c.note)}</small>`:''}</span>`).join('');
    const tags = p.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('');
    return `<section class="sec"><h2>一、学生画像（所有信息）</h2><div class="chips">${chips}</div><div class="chips" style="margin-top:14px;">${tags}</div></section>`;
  }

  function sec2() {
    const s = H.summary;
    const p = H.profile;
    const bars = p.academics.map(a => `<div class="bar-row"><span class="lab">${esc(a.name)}</span><div class="bar-track"><div class="bar-fill ${a.low?'low':''}" style="width:${a.pct}%"></div></div><span class="bar-val">${a.score} / ${a.max}</span></div>`).join('');
    const tri = `<div class="tricards">` + ['green','red','de'].map(k => { const c = s.tri[k]; const items = c.items.map(i => `<li>${esc(i)}</li>`).join(''); return `<div class="tcard ${k==='green'?'g':k==='red'?'r':'d'}"><h3>${esc(c.title)}</h3><ul>${items}</ul></div>`; }).join('') + `</div>`;
    const strengths = s.strengths.map(r => `<tr><td>${esc(r.dim)}</td><td>${esc(r.text)}</td></tr>`).join('');
    const weaknesses = s.weaknesses.map(r => `<tr><td>${esc(r.dim)}</td><td>${esc(r.text)}</td></tr>`).join('');
    return `<section class="sec"><h2>二、材料提取信息总结</h2><div style="font-size:13px;color:var(--text-l);margin:4px 0 2px;">学业竞争力（MYP 1–7 量表）</div>${bars}${tri}<div class="tq g"><h4>🟢 优点（引用老师评语）</h4><table>${strengths}</table></div><div class="tq r"><h4>🔴 改进点（引用老师评语）</h4><table>${weaknesses}</table></div></section>`;
  }

  function sec3() {
    const d = H.diagnosis;
    const sb = d.schools.map(s => `<div class="row"><span class="name">${esc(s.name)}</span><div class="grp"><div class="meter"><span class="mlab">匹配</span><div class="mtrack"><div class="mfill" style="width:${starPct(s.match)}%"></div></div><span class="stars">${esc(s.match)}</span></div><div class="meter"><span class="mlab">推荐</span><div class="mtrack"><div class="mfill" style="width:${starPct(s.rec)}%"></div></div><span class="stars">${esc(s.rec)}</span></div></div></div>`).join('');
    const tu = d.schools.map(s => `<div class="row"><span class="name">${esc(s.name)}</span><div class="track"><div class="fill" style="width:${s.pct}%"></div></div><span class="val">${esc(s.tuition)}</span></div>`).join('');
    const deList = d.deImpact.map(x => `<li ${x.conclusion?'class="de-conclusion"':''}><b>${esc(x.b)}</b>：${esc(x.t)}</li>`).join('');
    const majors = d.majors.map(m => `<tr ${m.warn?'class="warn"':''}><td>${esc(m.dir)}</td><td>${esc(m.major)}</td><td>${esc(m.basis)}</td></tr>`).join('');
    const schol = d.scholarship.map(p => `<div class="schol-card ${p.type}"><div class="schol-head"><span class="schol-badge ${p.type}">${esc(p.status)}</span><b>${esc(p.title)}</b></div><div class="schol-why">${esc(p.why)}</div><div class="schol-next"><b>建议：</b>${esc(p.next)}</div></div>`).join('');
    return `<section class="sec"><h2>三、目标学校诊断</h2><p class="sub">三校星级对比 + 学费对比 ＋ 德国籍影响 ＋ 专业推荐 ＋ 奖学金可行性</p><div class="sb">${sb}</div><div class="tu"><div style="font-size:13px;color:var(--text-l);margin-bottom:2px;">4 年总自费（无奖学金）</div>${tu}</div><div class="kq-box"><h4>🇩🇪 德国籍对目标学校诊断的影响</h4><ul>${deList}</ul></div><div class="major"><div class="block-title">🎯 专业推荐</div><table><tr><th>推荐方向</th><th>对应专业</th><th>依据</th></tr>${majors}</table></div><div class="stat">${schol}</div><div class="legend">${esc(d.starNote)}</div></section>`;
  }

  function sec4() {
    const iv = H.intervention;
    const roadmap = buildRoadmap(iv.roadmap);
    const rows = iv.actions.map(a => `<tr><td>${esc(a.goal)}</td><td class="pri">${esc(a.pri)}</td><td>${esc(a.basis)}</td><td>${esc(a.inSchool)}</td><td class="${a.outSchool==='暂无信息'?'na':''}">${esc(a.outSchool)}</td></tr>`).join('');
    return `<section class="sec"><h2>四、干预手段</h2><p class="sub">表1 · 最终目标拆解（路线图）｜ 表2 · 本学期目标拆解与行动建议</p><div class="block-title">📍 最终目标拆解 · 成长路线图</div>${roadmap}<div class="legend">${esc(iv.roadmap.legend)}</div><div class="block-title" style="margin-top:22px;">🎯 本学期目标拆解与行动建议</div><table class="atbl"><tr><th>本学期目标</th><th>优先级</th><th>依据</th><th>校内</th><th>校外</th></tr>${rows}</table></section>`;
  }

  // 渲染报告：优先显示老师修改后的内容，否则用原始数据
  const savedReport = localStorage.getItem('teacherReportHTML');
  if (H) {
    if (savedReport && savedReport.trim()) {
      document.getElementById('report').innerHTML = savedReport
        .replace(/ class="ed"/g, '')
        .replace(/contenteditable="true"/g, '');
    } else {
      document.getElementById('report').innerHTML = sec1() + sec2() + sec3() + sec4();
    }
  }

  // 老师审批意见已并入 teacherReportHTML（报告正文），此处不再单独展示，避免重复

  // 显示修订留痕
  const trails = JSON.parse(localStorage.getItem('trails') || '[]');
  const trailBox = document.getElementById('trailDisplay');
  if (trails.length > 0) {
    const trailHtml = trails.map(t => `<div class="item"><b>${esc(t.who)}</b> · ${esc(t.time)} · ${esc(t.what)}</div>`).join('');
    trailBox.innerHTML = `<div class="sec"><div class="trail-head"><h2>修订留痕</h2><button class="trail-clear" onclick="clearTrails()">🗑 清理修订留痕</button></div><div class="trail">${trailHtml}</div></div>`;
  }

  // 清理修订留痕（仅清除留痕记录，不影响报告本身）
  window.clearTrails = function() {
    if (!confirm('确定清理所有修订留痕？\n\n此操作不可撤销，仅清除留痕记录，不影响报告内容本身。')) return;
    localStorage.removeItem('trails');
    trailBox.innerHTML = '';
    alert('修订留痕已清理。');
  };

  // 同意通过
  window.handleAgree = function() {
    const note = document.getElementById('principalNote').value.trim();
    const sign = document.getElementById('principalSign').value.trim();
    if (!sign) { alert('请填写校长签名'); return; }
    if (note) localStorage.setItem('principalNote', note);
    localStorage.setItem('principalSign', sign);
    localStorage.setItem('principalStatus', 'approved');
    alert('审批通过！\n\n签名：' + sign + '\n\n报告已提交至导出步骤。');
    window.location.href = 'export.html';
  };

  // 退回修改
  window.handleReject = function() {
    const note = document.getElementById('principalNote').value.trim();
    const sign = document.getElementById('principalSign').value.trim();
    if (!sign) { alert('请填写校长签名'); return; }
    if (!note) { alert('请填写退回原因'); return; }
    localStorage.setItem('principalNote', note);
    localStorage.setItem('principalSign', sign);
    localStorage.setItem('principalStatus', 'rejected');
    alert('已退回修改！\n\n退回原因：' + note + '\n\n签名：' + sign);
    window.location.href = 'report.html';
  };
})();
</script>
<button class="reset-fab" title="清空所有录入/审批数据并回到首页" onclick="if(confirm('确定重置演示数据？\n将清空录入、AI访谈、老师/校长审批等所有记录，并回到首页。')){['studentInput','teacherReportHTML','teacherNote','principalNote','principalSign','interviewResult','principalStatus','trails'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});location.href='index.html';}">🔄 重置演示</button>
</body>
</html>
